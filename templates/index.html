<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>株AI v1</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<main><header><div><small>STOCK ANALYSIS LAB</small><h1>株AI <span>v1</span></h1><p>日本株・日足テクニカル分析プロトタイプ</p></div><div class="badge">DB不要</div></header>
<section class="search"><label>銘柄コード</label><div class="row"><input id="symbol" inputmode="numeric" placeholder="例：7203" value="7203"><button id="go">分析する</button></div><p class="hint">日本株は4桁コードを入力。例：7203 → 7203.T として取得します。</p></section>
<div id="status"></div>
<section id="result" class="hidden"><div class="hero"><div><small id="ticker"></small><h2 id="name"></h2><div class="price" id="price"></div></div><div class="score"><span>総合スコア</span><strong id="score"></strong><b id="verdict"></b></div></div>
<div class="grid"><article><span>RSI 14</span><strong id="rsi"></strong></article><article><span>5日移動平均</span><strong id="ma5"></strong></article><article><span>25日移動平均</span><strong id="ma25"></strong></article><article><span>75日移動平均</span><strong id="ma75"></strong></article></div>
<article class="panel"><h3>株価推移（直近90営業日）</h3><canvas id="chart"></canvas></article><article class="panel"><h3>判定根拠</h3><ul id="reasons"></ul></article><p class="notice">※ 投資助言ではありません。v1は日足テクニカルの試作ロジックです。実売買の判断はご自身で行ってください。</p></section></main>
<script>
let chart; const $=id=>document.getElementById(id);
$('go').onclick=run; $('symbol').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
async function run(){const s=$('symbol').value.trim(); $('status').innerHTML='<div class="loading">分析中...</div>'; $('result').classList.add('hidden'); try{const r=await fetch('/api/analyze?symbol='+encodeURIComponent(s)); const d=await r.json(); if(!r.ok)throw new Error(d.error||'取得失敗'); $('status').innerHTML=''; $('result').classList.remove('hidden'); $('ticker').textContent=d.symbol; $('name').textContent=d.name; $('price').textContent='¥ '+Number(d.price).toLocaleString(); $('score').textContent=d.score+' / 100'; $('verdict').textContent=d.verdict; $('rsi').textContent=d.rsi; $('ma5').textContent='¥ '+Number(d.ma5).toLocaleString(); $('ma25').textContent='¥ '+Number(d.ma25).toLocaleString(); $('ma75').textContent=d.ma75?'¥ '+Number(d.ma75).toLocaleString():'—'; $('reasons').innerHTML=d.reasons.map(x=>'<li>'+x+'</li>').join(''); if(chart)chart.destroy(); chart=new Chart($('chart'),{type:'line',data:{labels:d.chart.map(x=>x.date),datasets:[{label:'終値',data:d.chart.map(x=>x.close),borderWidth:2,pointRadius:0,tension:.15}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:7}},y:{ticks:{callback:v=>'¥'+v.toLocaleString()}}}}}); }catch(e){$('status').innerHTML='<div class="error">'+e.message+'</div>'}}
</script></body></html>
